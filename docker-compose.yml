services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmgr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskmgr_network

  redis:
    image: redis:7-alpine
    container_name: taskmgr_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskmgr_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmgr_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SERVER_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://taskuser:taskpassword@postgres:5432/taskdb?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: 24
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "lax"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmgr_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmgr_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/api/v1/ws
    ports:
      - "3000:3000"
    networks:
      - taskmgr_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  taskmgr_network:
    driver: bridge
